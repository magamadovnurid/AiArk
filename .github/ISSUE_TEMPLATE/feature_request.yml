name: Feature request
description: Propose a focused improvement to AiArk
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is difficult today, and who experiences it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed outcome
      description: Describe the result you want, not only a specific implementation.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Disk safety and preparation
        - Hardware detection and compatibility
        - Model catalog and downloads
        - Runtime management
        - Cluster discovery
        - Desktop interface
        - CLI and automation
        - Documentation
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Safety or compatibility considerations
      description: Note any disk writes, permissions, networking, model licenses, or platform-specific behavior.
